<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Quello — Dashboard</title>
  <script src="auth-boot.js"></script>
  <link rel="preload" href="fonts/TwemojiCountryFlags.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=7">
  <link rel="stylesheet" href="theme.css?v=4">
  <link rel="stylesheet" href="landing-redesign.css?v=4">
  <link rel="stylesheet" href="motion-polish.css?v=13">
  <link rel="stylesheet" href="sidebar-evolution.css?v=1">
  <link rel="stylesheet" href="auth.css?v=2">
  <link rel="stylesheet" href="sheet-select.css?v=1">
  <link rel="icon" type="image/png" href="quello-avatar.webp">
  <link rel="apple-touch-icon" href="quello-avatar.webp">
</head>
<body data-page="dashboard" data-title-key="title_dashboard">
  <nav class="nav">
    <div class="nav-inner">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu" data-i18n-aria="menu_open" aria-controls="sideMenu" aria-expanded="false">☰</button>
      <a class="brand" href="dashboard.html"><img class="brand-avatar" src="quello-avatar.webp" alt="Quello bot avatar" decoding="async" fetchpriority="high"> <span>Quello</span></a>
      <span class="dash-crumb is-hidden" id="crumb"></span>
      <div class="header-tools">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light / dark theme" data-i18n-aria="theme" title="Theme">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.6 14.4A8.6 8.6 0 0 1 9.6 3.4a.7.7 0 0 0-.9-.9 9.9 9.9 0 1 0 12.8 12.8.7.7 0 0 0-.9-.9Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.6" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g></svg>
        </button>
        <div class="header-language" id="headerLanguage">
          <button class="header-language-button" id="headerLanguageButton" type="button" aria-haspopup="listbox" aria-expanded="false" data-i18n-aria="language" aria-label="Language">
            <span class="flag" id="headerLanguageFlag">🇬🇧</span>
            <span id="headerLanguageCode">EN</span>
            <span class="header-language-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
          <div class="header-language-menu" id="headerLanguageMenu" role="listbox" aria-label="Language">
            <button type="button" data-header-language="en" role="option"><span class="flag">🇬🇧</span> <span>English</span></button>
            <button type="button" data-header-language="ru" role="option"><span class="flag">🇷🇺</span> <span>Русский</span></button>
            <button type="button" data-header-language="de" role="option"><span class="flag">🇩🇪</span> <span>Deutsch</span></button>
            <button type="button" data-header-language="fr" role="option"><span class="flag">🇫🇷</span> <span>Français</span></button>
            <button type="button" data-header-language="it" role="option"><span class="flag">🇮🇹</span> <span>Italiano</span></button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="menu-overlay" id="menuOverlay"></div>
  <aside class="side-menu" id="sideMenu" aria-hidden="true">
    <div class="side-menu-head">
      <div class="side-brand"><img src="quello-avatar.webp" alt="Quello bot avatar" decoding="async"><div><strong>Quello</strong><small data-i18n="kicker_dash">Dashboard</small></div></div>
      <button class="menu-close" id="menuClose" type="button" aria-label="Close menu" data-i18n-aria="menu_close">×</button>
    </div>
    <div class="side-menu-links">
      <div class="user-card is-hidden" id="userCard"></div>

      <div class="side-divider"></div>
      <div class="side-section-label" data-i18n="menu_server">SERVER</div>
      <input id="serverSearch" class="search-input side-search is-hidden" type="search" autocomplete="off" spellcheck="false">
      <div id="serverList" class="side-server-list"></div>
      <button class="side-action" id="allServersBtn" type="button"><span class="side-action-icon" aria-hidden="true">☷</span><span data-i18n="menu_switch">All servers</span></button>

      <div class="side-divider"></div>
      <div class="side-section-label" data-i18n="menu_links">LINKS</div>
      <a class="side-action side-action-primary" id="docsLink" href="index.html#home"><span class="side-action-icon" aria-hidden="true">📖</span><span data-i18n="menu_docs">Documentation</span></a>
      <a class="side-action" id="addLink" href="#" target="_blank" rel="noopener noreferrer"><span class="side-action-icon" aria-hidden="true">🤖</span><span data-i18n="menu_add">Add Quello to a server</span></a>

      <div class="side-divider"></div>
      <div class="side-section-label" data-i18n="menu_account">ACCOUNT</div>
      <button class="side-action" id="logoutBtn" type="button"><span class="side-action-icon" aria-hidden="true">⎋</span><span data-i18n="menu_logout">Log out</span></button>
    </div>
  </aside>

  <main class="auth-main" id="app" aria-live="polite"></main>

  <div class="save-bar" id="saveBar" role="region" aria-label="Unsaved changes">
    <span id="saveCount"></span>
    <button class="button ghost" id="discardBtn" type="button" data-i18n="discard">Discard</button>
    <button class="button hero-primary" id="saveBtn" type="button" data-i18n="save">Save changes</button>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="site-config.js"></script>
  <script src="auth-common.js?v=2"></script>
  <script src="dashboard.js?v=5"></script>
  <script src="sheet-select.js?v=1"></script>
</body>
</html>
