<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Feedback Center — Quello</title><script src="auth-boot.js"></script><script src="theme-switch.js?v=1"></script><link rel="stylesheet" href="style.css?v=8"><link rel="stylesheet" href="theme.css?v=4"><link rel="stylesheet" href="auth.css?v=2"><link rel="stylesheet" href="feedback.css?v=1"><link rel="stylesheet" href="quello-pages.css?v=2"></head>
<body><nav class="quello-page-nav" aria-label="Quello navigation"><a href="index.html">Quello</a><a href="about.html">About Creator</a><a href="profile-settings.html">My Profile</a><a href="server-discovery.html">Server Discovery</a><a href="feedback.html">Feedback Center</a><a href="privacy.html">Privacy</a></nav>
<main class="feedback-main"><header><span class="eyebrow">QUELLO COMMUNITY</span><h1 id="fcTitle">Feedback Center</h1><p id="fcIntro">Share an idea, report a problem or ask a question. Follow updates and discuss your submission with the Quello team.</p></header>
<section class="feedback-layout"><form id="feedbackForm" class="feedback-card"><h2 id="fcSubmitTitle">Submit feedback</h2><label><span id="fcCategory">Category</span><select id="category"><option value="idea">Feature idea</option><option value="bug">Bug report</option><option value="question">Question</option><option value="other">Other</option></select></label><label><span id="fcTitleLabel">Title</span><input id="title" minlength="5" maxlength="100" required placeholder="A short summary"></label><label><span id="fcDescription">Description</span><textarea id="body" minlength="10" maxlength="4000" rows="6" required placeholder="Describe your idea or issue…"></textarea></label><button class="button hero-primary" type="submit" id="fcSend">Send feedback</button><p id="formStatus" role="status" aria-live="polite"></p></form>
<section class="feedback-card"><div class="feedback-heading"><h2 id="fcYour">Your submissions</h2><button class="button" id="refreshFeedback" type="button">Refresh</button></div><div id="feedbackList" aria-live="polite">Loading…</div></section></section></main>
<script src="site-config.js?v=2"></script><script src="auth-common.js?v=4"></script><script src="feedback.js?v=1"></script></body></html>
