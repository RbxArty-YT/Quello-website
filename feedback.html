<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#0f1117"><title>Feedback Center — Quello</title>
<script src="auth-boot.js"></script><script src="theme-switch.js?v=1"></script><link rel="stylesheet" href="style.css?v=9"><link rel="stylesheet" href="theme.css?v=5"><link rel="stylesheet" href="brand-gradient.css?v=2"><link rel="stylesheet" href="auth.css?v=3"><link rel="stylesheet" href="account-pages.css?v=1"><link rel="stylesheet" href="feedback.css?v=2"><link rel="stylesheet" href="quello-ui-system.css?v=3">  <link rel="stylesheet" href="header-avatar.css?v=3">
  <link rel="stylesheet" href="sheet-select.css?v=2">
</head>
<body class="q-account-page"><header class="q-account-header"><a class="q-account-brand" href="dashboard.html"><img src="quello-avatar.webp" alt=""><span>Quello</span></a><div class="q-account-actions"><a class="q-account-back" href="dashboard.html" id="fcDashboard">← Dashboard</a><select id="accountLanguage" class="q-account-language" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="it">Italiano</option></select><button id="accountTheme" class="q-account-theme" type="button" aria-label="Toggle theme" title="Theme">◐</button></div></header>
<main class="q-account-main feedback-main"><header class="q-account-hero"><span class="q-account-eyebrow">QUELLO COMMUNITY</span><h1 id="fcTitle">Feedback Center</h1><p id="fcIntro">Share an idea, report a problem or ask a question. Follow updates and discuss your submission with the Quello team.</p></header>
<section class="feedback-layout"><form id="feedbackForm" class="q-account-card feedback-card"><h2 id="fcSubmitTitle">Submit feedback</h2><label><span id="fcCategory">Category</span><select id="category"><option value="idea">Feature idea</option><option value="bug">Bug report</option><option value="question">Question</option><option value="other">Other</option></select></label><label><span id="fcTitleLabel">Title</span><input id="title" minlength="5" maxlength="100" required placeholder="A short summary"></label><label><span id="fcDescription">Description</span><textarea id="body" minlength="10" maxlength="4000" rows="6" required placeholder="Describe your idea or issue…"></textarea></label><button class="q-account-button primary" type="submit" id="fcSend">Send feedback</button><p id="formStatus" class="q-account-status" role="status" aria-live="polite"></p></form>
<section class="q-account-card feedback-card"><div class="feedback-heading"><h2 id="fcYour">Your submissions</h2><div class="feedback-actions"><button class="q-account-button" id="refreshFeedback" type="button">Refresh</button></div></div><div id="feedbackList" aria-live="polite">Loading…</div></section></section>
<footer class="q-account-footer"><a href="dashboard.html" class="q-account-back" id="fcBack">← Back to Dashboard</a><span>Quello Feedback Center</span></footer></main>
<script src="site-config.js?v=2"></script><script src="auth-common.js?v=5"></script><script src="account-pages.js?v=1"></script><script src="feedback.js?v=2"></script>  <script src="sheet-select.js?v=2"></script>
  <script src="header-avatar.js?v=4"></script>
</body></html>
