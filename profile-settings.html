<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#0f1117"><title>Profile Privacy — Quello</title>
<script src="auth-boot.js"></script><script src="theme-switch.js?v=1"></script><link rel="stylesheet" href="style.css?v=9"><link rel="stylesheet" href="theme.css?v=5"><link rel="stylesheet" href="brand-gradient.css?v=2"><link rel="stylesheet" href="auth.css?v=3"><link rel="stylesheet" href="account-pages.css?v=1"><link rel="stylesheet" href="profile-settings.css?v=2"><link rel="stylesheet" href="quello-ui-system.css?v=3">  <link rel="stylesheet" href="header-avatar.css?v=3">

<body class="q-account-page"><header class="q-account-header"><a class="q-account-brand" href="dashboard.html"><img src="quello-avatar.webp" alt=""><span>Quello</span></a><div class="q-account-actions"><a class="q-account-back" href="dashboard.html" id="settingsDashboard">← Dashboard</a><select id="accountLanguage" class="q-account-language" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="it">Italiano</option></select><button id="accountTheme" class="q-account-theme" type="button" aria-label="Toggle theme" title="Theme">◐</button></div></header>
<main class="q-account-main profile-settings"><section class="q-account-hero profile-settings-card"><span class="q-account-eyebrow">QUELLO ACCOUNT</span><h1 id="settingsTitle">Public profile privacy</h1><p id="settingsIntro">Choose what other people can see on your public Quello profile.</p><div id="settingsLoading" class="q-account-status" role="status">Loading your settings…</div>
<label class="privacy-option"><input id="isPublic" type="checkbox"><span><strong id="publicLabel">Enable public profile</strong><small id="publicHint">Allow anyone with your profile link to view it.</small></span></label>
<label class="privacy-option"><input id="showAnswers" type="checkbox" checked><span><strong id="answersLabel">Show QOTD answers</strong><small id="answersHint">Display your total number of answers.</small></span></label>
<label class="privacy-option"><input id="showQuestions" type="checkbox" checked><span><strong id="questionsLabel">Show published questions</strong><small id="questionsHint">Display how many questions you have published.</small></span></label>
<label class="privacy-option"><input id="showAchievements" type="checkbox" checked><span><strong id="achievementsLabel">Show achievements</strong><small id="achievementsHint">Display achievements earned across Quello.</small></span></label>
<div class="profile-settings-actions"><button class="q-account-button primary" id="savePrivacy" type="button" disabled>Save privacy settings</button><a id="profileLink" class="is-hidden" href="#" target="_blank" rel="noopener noreferrer">Open public profile</a></div><p id="privacyStatus" class="q-account-status" role="status" aria-live="polite"></p></section><footer class="q-account-footer"><a href="dashboard.html" class="q-account-back" id="settingsBack">← Back to Dashboard</a><span>Control what appears on your public Quello profile</span></footer></main>
